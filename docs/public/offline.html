<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - FaceSign API Documentation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background-color: #f9fafb;
      color: #374151;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .container {
      max-width: 28rem;
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }
    
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      background-color: #fef3c7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    svg {
      width: 2rem;
      height: 2rem;
      color: #f59e0b;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    
    p {
      color: #6b7280;
      margin-bottom: 1.5rem;
    }
    
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background-color: #10b981;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #059669;
    }
    
    .btn-secondary {
      background-color: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    
    .btn-secondary:hover {
      background-color: #e5e7eb;
    }
    
    .cached-pages {
      margin-top: 2rem;
      text-align: left;
    }
    
    .cached-pages h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #111827;
    }
    
    .cached-pages ul {
      list-style: none;
      space-y: 0.5rem;
    }
    
    .cached-pages li {
      margin-bottom: 0.5rem;
    }
    
    .cached-pages a {
      color: #10b981;
      text-decoration: none;
      font-size: 0.875rem;
    }
    
    .cached-pages a:hover {
      text-decoration: underline;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111827;
        color: #f3f4f6;
      }
      
      .container {
        background-color: #1f2937;
      }
      
      h1 {
        color: #f9fafb;
      }
      
      .cached-pages h3 {
        color: #f9fafb;
      }
      
      .btn-secondary {
        background-color: #374151;
        color: #f3f4f6;
        border-color: #4b5563;
      }
      
      .btn-secondary:hover {
        background-color: #4b5563;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
      </svg>
    </div>
    
    <h1>You're Offline</h1>
    <p>
      It looks like you're not connected to the internet. Don't worry – you can still 
      access cached documentation pages.
    </p>
    
    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">
        Try Again
      </button>
      <button class="btn-secondary" onclick="history.back()">
        Go Back
      </button>
    </div>
    
    <div class="cached-pages">
      <h3>Available Offline</h3>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/quickstart">Quick Start</a></li>
        <li><a href="/authentication">Authentication</a></li>
        <li><a href="/sessions">Sessions</a></li>
        <li><a href="/modules">Modules</a></li>
        <li><a href="/webhooks">Webhooks</a></li>
        <li><a href="/errors">Error Handling</a></li>
      </ul>
    </div>
  </div>
  
  <script>
    // Check if back online
    window.addEventListener('online', function() {
      window.location.reload();
    });
    
    // Update the UI based on connection status
    function updateConnectionStatus() {
      if (navigator.onLine) {
        window.location.reload();
      }
    }
    
    // Check connection periodically
    setInterval(updateConnectionStatus, 5000);
  </script>
</body>
</html>
